<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boardnify - Creative Collaboration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=Epilogue:wght@400;500;700&family=Satoshi:wght@400;500;700&family=General+Sans:wght@400;500;700&family=Cabinet+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=general-sans@400,500,700&f[]=cabinet-grotesk@400,500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=2">
  <style>
    /* CRITICAL LAYOUT: Use CSS Grid for reliable sidebar+content layout */
    body {
      display: grid !important;
      grid-template-columns: 260px 1fr !important;
      grid-template-rows: 100vh !important;
      overflow: hidden !important;
    }
    aside {
      width: 260px !important;
      min-width: 260px !important;
      max-width: 260px !important;
      grid-row: 1 !important;
      grid-column: 1 !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
    }
    /* CRITICAL: Force vertical stacking of topbar + main content */
    body > aside + div {
      display: flex !important;
      flex-direction: column !important;
      grid-row: 1 !important;
      grid-column: 2 !important;
      overflow: hidden !important;
      width: 100% !important;
      min-width: 0 !important;
    }
    /* Make #app fill remaining space */
    body > aside + div > main#app {
      flex: 1 1 0% !important;
      min-height: 0 !important;
      min-width: 0 !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      max-width: 100% !important;
    }
    /* Topbar must not shrink */
    body > aside + div > div:first-of-type {
      flex-shrink: 0 !important;
      width: 100% !important;
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'jakarta': ['"Plus Jakarta Sans"', 'sans-serif'],
            'outfit': ['"Outfit"', 'sans-serif'],
            'manrope': ['"Manrope"', 'sans-serif'],
            'dmsans': ['"DM Sans"', 'sans-serif'],
            'epilogue': ['"Epilogue"', 'sans-serif'],
            'satoshi': ['"Satoshi"', 'sans-serif'],
            'generalsans': ['"General Sans"', 'sans-serif'],
            'cabinet': ['"Cabinet Grotesk"', 'sans-serif']
          },
          colors: {
            brand: '#F97316', // Orange-500
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 h-screen flex overflow-hidden font-outfit">
  
  <!-- Sidebar Navigation -->
  <aside style="width:260px;min-width:260px;max-width:260px;" class="flex-shrink-0 bg-white border-r border-gray-200 z-50 flex flex-col py-8">
    <div class="px-6 text-2xl font-bold tracking-tight text-gray-800 mb-10 flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-brand flex items-center justify-center text-white shadow-lg shadow-brand/20">B</div>
      <span class="font-cabinet">Boardnify</span>
    </div>

    <nav class="w-full flex flex-col gap-1.5 flex-grow">
      <a href="#" data-route="dashboard" class="nav-link active flex items-center py-2.5 px-4 rounded-xl text-gray-900 font-semibold transition-all">
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        Dashboard
      </a>
      <a href="#" data-route="moodboard" class="nav-link flex items-center py-2.5 px-4 rounded-xl text-gray-600 font-medium hover:bg-gray-50 transition-all">
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        Moodboard Builder
      </a>
      <a href="#" data-route="script" class="nav-link flex items-center py-2.5 px-4 rounded-xl text-gray-600 font-medium hover:bg-gray-50 transition-all">
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        Scripts
      </a>
      <a href="#" data-route="kanban" class="nav-link flex items-center py-2.5 px-4 rounded-xl text-gray-600 font-medium hover:bg-gray-50 transition-all">
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
        Task Tracker
      </a>
      <a href="#" data-route="library" class="nav-link flex items-center py-2.5 px-4 rounded-xl text-gray-600 font-medium hover:bg-gray-50 transition-all">
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
        Media Library
      </a>
      <a href="#" data-route="styleframes" class="nav-link flex items-center py-2.5 px-4 rounded-xl text-gray-600 font-medium hover:bg-gray-50 transition-all">
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"></path></svg>
        Style Frames
      </a>
      <a href="#" data-route="motionprojects" class="nav-link flex items-center py-2.5 px-4 rounded-xl text-gray-600 font-medium hover:bg-gray-50 transition-all">
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
        Motion Projects
      </a>
      <a href="#" data-route="reviews" class="nav-link flex items-center justify-between py-2.5 px-4 rounded-xl text-gray-600 font-medium hover:bg-gray-50 transition-all">
        <div class="flex items-center">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
          Reviews
        </div>
        <span id="nav-reviews-badge" class="bg-brand text-white text-[10px] font-bold px-2 py-0.5 rounded-full hidden">0</span>
      </a>
    </nav>
    
    <div class="mt-auto pb-4 px-4 w-full flex flex-col gap-2">
      <a href="#" data-route="trash" class="nav-link flex items-center justify-between py-3 px-4 rounded-lg text-gray-600 hover:bg-red-50 hover:text-red-600 transition-colors">
        <div class="flex items-center">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          Trash
        </div>
        <span id="nav-trash-badge" class="bg-gray-200 text-gray-600 text-xs font-bold px-2 py-0.5 rounded-full hidden">0</span>
      </a>
      <button class="w-full border border-gray-200 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium transition flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        Sign Out
      </button>
    </div>
  </aside>

  <!-- Main Content Area with Topbar -->
  <div class="flex-1 flex flex-col min-w-0" style="flex-direction:column; height:100%; overflow:hidden;">
    
    <!-- Global Topbar (Client Selector & Role Toggle) -->
    <div class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 z-30 shadow-sm flex-shrink-0">
      <div class="flex items-center gap-6">
        <span class="text-sm font-medium text-gray-500 uppercase tracking-widest">Global View</span>
        
        <div class="h-6 w-px bg-gray-200"></div>
        
        <!-- Role Toggle -->
        <div class="flex items-center gap-2 bg-gray-100 p-1 rounded-lg">
          <button id="role-toggle-designer" class="px-3 py-1 text-xs font-bold rounded-md bg-white text-gray-800 shadow-sm smooth-transition">Designer</button>
          <button id="role-toggle-client" class="px-3 py-1 text-xs font-bold rounded-md text-gray-500 hover:text-gray-800 smooth-transition">Client View</button>
        </div>

        <button id="access-settings-btn" class="p-2 text-gray-400 hover:text-brand bg-gray-50 hover:bg-gray-100 rounded-lg smooth-transition border border-gray-200" title="Client Access Settings">
           <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </button>
      </div>
      
      <!-- Right Side Controls -->
      <div class="flex items-center gap-6">
        <div class="flex items-center gap-4">
          <label for="global-client-select" class="text-sm font-medium text-gray-600">Active Client:</label>
          <select id="global-client-select" class="bg-gray-50 border border-gray-200 text-gray-800 text-sm rounded-lg focus:ring-brand focus:border-brand block w-48 p-2 font-medium shadow-sm outline-none cursor-pointer">
            <option value="All">All Clients</option>
            <option value="Acme Corp">Acme Corp</option>
            <option value="Globex">Globex</option>
            <option value="Initech">Initech</option>
          </select>
        </div>

        <div class="h-6 w-px bg-gray-200"></div>

        <!-- Notifications -->
        <div class="relative flex items-center">
          <button id="nav-notif-btn" class="p-2 text-gray-400 hover:text-brand bg-gray-50 hover:bg-gray-100 rounded-lg smooth-transition border border-gray-200 relative" title="Notifications">
             <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
             <span id="nav-notif-badge" class="absolute -top-1 -right-1 flex h-4 w-4 items-center justify-center rounded-full bg-red-500 text-[9px] font-bold text-white shadow-sm ring-2 ring-white hidden">0</span>
          </button>

          <!-- Notification Dropdown -->
          <div id="nav-notif-dropdown" class="absolute right-0 top-full mt-3 w-80 bg-white rounded-2xl shadow-2xl border border-gray-100 hidden flex-col z-[100] overflow-hidden transform opacity-0 scale-95 transition-all">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
              <h3 class="font-bold text-gray-800">Notifications</h3>
              <button id="nav-notif-mark-read" class="text-xs font-bold text-brand hover:text-brand/80">Mark all read</button>
            </div>
            <div id="nav-notif-list" class="flex flex-col max-h-[300px] overflow-y-auto">
               <!-- injected by JS -->
            </div>
          </div>
        </div>

        <div class="h-6 w-px bg-gray-200"></div>

        <!-- Theme Toggle -->
        <button id="theme-toggle" class="p-2 text-gray-400 hover:text-brand bg-gray-50 hover:bg-gray-100 rounded-lg smooth-transition border border-gray-200" title="Toggle Dark/Light Mode">
          <svg id="theme-icon-sun" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M16.95 16.95l.707.707M7.05 7.05l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z"></path></svg>
          <svg id="theme-icon-moon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
      </div> <!-- End Right Side Controls -->

    </div> <!-- End Global Topbar -->

    <!-- View containers injected dynamically -->
    <main class="flex-1 flex flex-col relative w-full h-full overflow-y-auto" id="app"></main>
  </div>

  <!-- Client Access Permissions Modal -->
  <div id="access-modal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-md z-[200] flex items-center justify-center hidden opacity-0 smooth-transition">
    <div class="bg-white rounded-3xl shadow-2xl w-[450px] max-w-full overflow-hidden transform scale-95 transition-all duration-300" id="access-modal-content">
      <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
        <div>
          <h2 class="text-lg font-bold text-gray-800">Client Access Permissions</h2>
          <p class="text-xs text-gray-500 mt-1">Control which features the client sees for this project.</p>
        </div>
        <button id="access-close-btn" class="text-gray-400 hover:text-gray-600 p-2 hover:bg-white rounded-full smooth-transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
      </div>
      <div class="p-6 flex flex-col gap-0" id="access-toggles-container">
        <!-- Toggles injected via JS -->
      </div>
    </div>
  </div>

  <script src="js/utils/api.js"></script>
  <script src="js/utils/supabase.js"></script>
  <script src="js/utils/editor.js"></script>
  <script src="js/utils/textToolbar.js"></script>
  <script src="js/utils/audioRecorder.js"></script>
  <script src="js/utils/notifications.js"></script>
  <script src="js/components/collaborators.js"></script>
  <script src="js/components/inviteModal.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/moodboard.js"></script>
  <script src="js/views/script.js"></script>
  <script src="js/views/kanban.js"></script>
  <script src="js/views/library.js"></script>
  <script src="js/views/styleframes.js"></script>
  <script src="js/views/motionprojects.js"></script>
  <script src="js/views/reviews.js"></script>
  <script src="js/views/trash.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
