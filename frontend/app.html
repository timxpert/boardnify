<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Boardnify - Creative Collaboration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,500,700,400,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <link rel="stylesheet" href="css/styles.css?v=3">
  <link rel="stylesheet" href="css/refinements.css?v=1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // Initialize PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  <script>
    async function signOut() {
      const sb = window.supabaseClient;
      await sb.auth.signOut();
      window.location.href = 'index.html';
    }
  </script>
  <style>
    /* Critical layout overrides for the new design system */
    body {
      overflow: hidden;
      background-color: var(--bg-white);
      color: var(--text-main);
      font-family: 'DM Sans', sans-serif;
    }

    #app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      max-width: 430px;
      margin: 0 auto;
      background-color: var(--bg-white);
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      position: relative;
    }

    #app {
      flex: 1;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      background-color: var(--bg-canvas);
      scroll-behavior: smooth;
      padding-bottom: 70px; /* Space for bottom nav */
    }

    .m-topbar {
      flex-shrink: 0;
      height: 60px;
      border-bottom: 1px solid var(--border-light);
      background: var(--bg-white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 90;
      position: relative;
    }

    .nav-link {
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      color: #6B6B6B;
      cursor: pointer;
      margin-bottom: 8px;
      transition: all 0.2s ease;
      position: relative;
    }

    .nav-link:active {
      background-color: #F5F5F4;
      color: var(--text-main);
    }

    .nav-link.active {
      color: var(--accent-purple);
    }

    .nav-link.active svg {
      color: var(--brand);
    }
    .nav-link.active span {
       color: var(--brand);
    }

    /* Topbar Breadcrumb */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .breadcrumb-item:hover { color: var(--text-main); cursor: pointer; }
    .breadcrumb-separator { color: var(--border-light); font-size: 10px; }

    .board-title-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 800;
      color: var(--text-main);
      white-space: nowrap;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 480px) {
       .board-title-center {
         display: none; /* Hide on very small screens to avoid overlap */
       }
    }

    .top-action-btn {
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 6px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .top-action-btn:hover {
      background: #F5F5F4;
      color: var(--text-main);
    }

    .top-action-btn.primary {
      background: var(--accent-purple);
      color: white;
      box-shadow: 0 1px 2px rgba(124,111,247,0.2);
    }
    
    .top-action-btn.primary:hover {
      opacity: 0.9;
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#7C6FF7',
            m_yellow: '#F5C842',
            m_canvas: '#F0EFED',
          }
        }
      }
    }
  </script>
</head>

<body>
  <div id="app-shell">
    <!-- Top Bar -->
    <header class="m-topbar" id="m-topbar">
      <!-- Left: Avatar -->
      <button id="global-settings-btn" class="w-10 h-10 rounded-full overflow-hidden bg-primary/10 border border-primary/20 shrink-0">
         <img id="sidebar-avatar" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=200&auto=format&fit=crop" class="w-full h-full object-cover">
      </button>

      <!-- Center: Logo -->
      <div class="flex items-center gap-2 board-title-center">
        <div class="w-6 h-6 bg-primary rounded-lg flex items-center justify-center">
          <div class="w-2 h-2 bg-white rounded-sm"></div>
        </div>
        <span class="font-black text-lg tracking-tight">Boardnify</span>
      </div>

      <!-- Right: Search + Bell -->
      <div class="flex items-center gap-1">
        <button class="p-2 text-gray-400 hover:text-primary transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </button>
        <button class="p-2 text-gray-400 hover:text-primary transition-colors relative">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
          <span class="absolute top-2 right-2 w-2 h-2 bg-primary rounded-full border-2 border-white"></span>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main id="app" class="flex flex-col w-full h-full min-h-0 overflow-y-auto">
       <div class="w-full h-full flex flex-col items-center justify-center gap-4 animate-pulse">
          <div class="w-12 h-12 bg-primary/10 rounded-2xl flex items-center justify-center">
             <div class="w-2 h-2 bg-primary rounded-full"></div>
          </div>
          <p class="text-[10px] font-black text-gray-300 uppercase tracking-widest">Waking up workspace...</p>
       </div>
    </main>

    <!-- Mobile Bottom Navigation (5 Tabs) -->
    <nav class="fixed bottom-0 flex bg-white border-t border-gray-100 items-center justify-around px-2 pb-[env(safe-area-inset-bottom)] h-[74px] z-[1000] shadow-[0_-4px_16px_rgba(107,33,255,0.06)]" style="width: 100%; max-width: 430px; margin: 0 auto; left: 0; right: 0;" id="m-bottom-nav">
      <a class="nav-link flex flex-col items-center justify-center gap-1.5 w-14 h-14 transition-all" data-route="dashboard" onclick="window.navigate('dashboard')">
        <div class="nav-active-bg absolute inset-0 bg-[#6B21FF] rounded-2xl opacity-0 scale-90 transition-all"></div>
        <svg class="w-6 h-6 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        <span class="text-[10px] font-black uppercase tracking-[0.05em] relative z-10">Projects</span>
      </a>
      <a class="nav-link flex flex-col items-center justify-center gap-1.5 w-14 h-14 transition-all" data-route="script" onclick="window.navigate('script')">
        <div class="nav-active-bg absolute inset-0 bg-[#6B21FF] rounded-2xl opacity-0 scale-90 transition-all"></div>
        <svg class="w-6 h-6 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        <span class="text-[10px] font-black uppercase tracking-[0.05em] relative z-10">Scripts</span>
      </a>
      <a class="nav-link flex flex-col items-center justify-center gap-1.5 w-14 h-14 transition-all active" data-route="moodboard" onclick="window.navigate('moodboard')">
        <div class="nav-active-bg absolute inset-0 bg-[#6B21FF] rounded-2xl opacity-0 scale-90 transition-all"></div>
        <svg class="w-6 h-6 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zM14 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path></svg>
        <span class="text-[10px] font-black uppercase tracking-[0.05em] relative z-10">Canvas</span>
      </a>
      <a class="nav-link flex flex-col items-center justify-center gap-1.5 w-14 h-14 transition-all" data-route="reviews" onclick="window.navigate('reviews')">
        <div class="nav-active-bg absolute inset-0 bg-[#6B21FF] rounded-2xl opacity-0 scale-90 transition-all"></div>
        <svg class="w-6 h-6 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        <span class="text-[10px] font-black uppercase tracking-[0.05em] relative z-10">Reviews</span>
      </a>
      <a class="nav-link flex flex-col items-center justify-center gap-1.5 w-14 h-14 transition-all" data-route="settings" onclick="window.navigate('settings')">
        <div class="nav-active-bg absolute inset-0 bg-[#6B21FF] rounded-2xl opacity-0 scale-90 transition-all"></div>
        <svg class="w-6 h-6 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.717 1.717 0 013.157.694c1.283.57 2.457 1.49 3.347 2.595a1.717 1.717 0 011.01 2.222 10.978 10.978 0 010 3.344 1.717 1.717 0 01-1.01 2.222c-.89 1.106-2.064 2.025-3.347 2.595a1.717 1.717 0 01-3.157.694c-.426 1.756-2.924-1.756-3.35 0a1.717 1.717 0 01-3.157-.694c-1.283-.57-2.457-1.49-3.347-2.595a1.717 1.717 0 01-1.01-2.222 10.978 10.978 0 010-3.344 1.717 1.717 0 011.01-2.222c.89-1.106 2.064-2.025 3.347-2.595a1.717 1.717 0 013.157-.694zM15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        <span class="text-[10px] font-black uppercase tracking-[0.05em] relative z-10">Settings</span>
      </a>
    </nav>

    <!-- Mobile Bottom Sheet (Used for all modals now) -->
    <div id="m-bottom-sheet-overlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[1000] hidden"></div>
    <div id="m-bottom-sheet" class="fixed inset-x-0 bottom-0 bg-white rounded-t-[32px] shadow-2xl transform translate-y-full transition-transform duration-300 z-[1001] p-6 pb-10 border-t border-gray-100">
       <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-8"></div>
       <div id="m-bottom-sheet-content"></div>
    </div>


    <!-- Mobile Editor Overlay -->

    <!-- Mobile Editor Overlay -->
    <div id="m-mobile-editor-overlay" style="display: none;" class="fixed inset-0 bg-white z-[10000] flex-col pt-[env(safe-area-inset-top)]">
       <div class="h-14 border-b border-gray-100 flex items-center justify-between px-4 shrink-0 bg-white">
          <button id="mb-editor-back" class="px-3 py-2 font-bold text-xs uppercase tracking-widest text-gray-400 hover:text-text-dark transition">BACK</button>
          <div id="m-mobile-editor-toolbar" class="flex gap-2 items-center"></div>
          <button id="mb-editor-done" class="px-4 py-2 font-black text-xs uppercase tracking-widest text-brand hover:scale-105 transition">DONE</button>
       </div>
       <div id="m-mobile-editor-body" contenteditable="true" 
            class="flex-1 p-6 md:p-10 outline-none text-lg md:text-xl text-[#1A1916] font-medium empty:before:content-[attr(data-placeholder)] empty:before:text-gray-300 empty:before:pointer-events-none"
            data-placeholder="Start typing your thoughts..."></div>
    </div>

  </div>


    <!-- Profile Popover Layer -->
    <div id="profile-modal" class="hidden fixed inset-0 z-[1000] animate-fade-in bg-black/40 backdrop-blur-sm">
        <div onclick="this.parentElement.classList.add('hidden')" class="absolute inset-0 bg-transparent"></div>
        <div id="profile-modal-content" class="absolute bottom-0 left-0 w-full bg-white rounded-t-3xl pb-8 shadow-2xl border-t border-gray-100 overflow-hidden transform translate-y-full opacity-0 transition-all duration-300">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mt-3 mb-2"></div>
            <div class="p-5 border-b border-gray-50 flex items-center gap-4">
                <div class="w-12 h-12 rounded-full overflow-hidden bg-brand/10 border border-brand/20">
                    <img id="profile-avatar" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=200&auto=format&fit=crop" class="w-full h-full object-cover">
                </div>
                <div class="overflow-hidden">
                    <h4 id="profile-name" class="font-bold text-sm text-text-dark truncate">User Name</h4>
                    <p id="profile-email" class="text-[10px] text-text-muted truncate">user@example.com</p>
                </div>
            </div>
            <div class="p-2">
                <button id="popover-settings-btn" onclick="window.navigate('settings'); document.getElementById('profile-modal').classList.add('hidden')" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-gray-50 text-xs font-bold text-gray-600 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.717 1.717 0 013.157.694c1.283.57 2.457 1.49 3.347 2.595a1.717 1.717 0 011.01 2.222 10.978 10.978 0 010 3.344 1.717 1.717 0 01-1.01 2.222c-.89 1.106-2.064 2.025-3.347 2.595a1.717 1.717 0 01-3.157.694c-.426 1.756-2.924-1.756-3.35 0a1.717 1.717 0 01-3.157-.694c-1.283-.57-2.457-1.49-3.347-2.595a1.717 1.717 0 01-1.01-2.222 10.978 10.978 0 010-3.344 1.717 1.717 0 011.01-2.222c.89-1.106 2.064-2.025 3.347-2.595a1.717 1.717 0 013.157-.694zM15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Settings
                </button>
                <button onclick="signOut()" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-red-50 text-xs font-bold text-red-500 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Sign Out
                </button>
            </div>
        </div>
    </div>

    <!-- Account Settings Modal Removed - Now a View -->

    <!-- Avatar Cropper Modal -->
    <div id="crop-modal" class="hidden fixed inset-0 z-[2000] modal-overlay flex items-center justify-center p-4 transition-opacity duration-300 opacity-0">
        <div id="crop-modal-content" class="bg-white w-full max-w-md rounded-[32px] overflow-hidden shadow-subtle flex flex-col transform scale-95 transition-all duration-300">
            <div class="p-6 border-b border-gray-50 flex items-center justify-between">
                <h3 class="font-bold text-text-dark">Crop Profile Photo</h3>
                <button onclick="document.getElementById('crop-modal').classList.add('hidden')" class="text-gray-300 hover:text-text-dark transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-8 flex items-center justify-center bg-gray-900">
                <div class="max-w-full max-h-[50vh] overflow-hidden">
                    <img id="crop-preview-img" class="max-w-full">
                </div>
            </div>
            <div class="p-6 bg-gray-50 flex gap-3">
                 <button onclick="document.getElementById('crop-modal').classList.add('hidden')" class="flex-1 py-3 text-[10px] font-black uppercase tracking-widest text-gray-400">Cancel</button>
                 <button id="crop-apply-btn" class="flex-1 py-3 bg-brand text-white rounded-xl text-[10px] font-black uppercase tracking-widest">Apply Transformation</button>
            </div>
        </div>
    </div>

    <!-- Delete Account Security Check -->
    <div id="delete-security-modal" class="hidden fixed inset-0 z-[3000] modal-overlay flex items-center justify-center p-4 transition-opacity duration-300 opacity-0">
        <div id="delete-security-content" class="bg-white w-full max-w-sm rounded-[32px] p-8 shadow-subtle transform scale-95 transition-all duration-300 text-center">
            <div class="w-16 h-16 bg-red-50 text-red-500 rounded-2xl flex items-center justify-center mx-auto mb-6">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <h3 class="text-lg font-bold text-text-dark mb-2">Delete Workspace?</h3>
            <p class="text-xs text-text-muted font-medium mb-8">This action is irreversible. All your boards, scripts and tasks will be permanently removed.</p>
            <div class="space-y-4">
                <div class="text-left space-y-2">
                    <label class="text-[9px] font-black uppercase tracking-widest text-gray-400">Type "Delete my account" to confirm</label>
                    <input type="text" id="delete-confirm-input" class="w-full p-4 rounded-xl border border-red-100 text-xs font-bold text-red-600 outline-none focus:border-red-500 transition-all">
                </div>
                <div class="flex gap-3">
                    <button id="delete-cancel-btn" class="flex-1 py-4 text-[10px] font-black uppercase tracking-widest text-gray-400 hover:text-text-dark transition">Keep Everything</button>
                </div>
                <button id="final-delete-btn" disabled class="w-full py-5 bg-red-50 text-red-300 font-black rounded-2xl transition-all uppercase tracking-widest text-[10px] cursor-not-allowed">Delete My Account</button>
            </div>
        </div>
    </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils/supabase.js"></script>
  <script src="js/utils/editor.js"></script>
  <script src="js/utils/textToolbar.js"></script>
  <script src="js/utils/audioRecorder.js"></script>
  <script src="js/utils/notifications.js"></script>
  <script src="js/components/collaborators.js"></script>
  <script src="js/components/inviteModal.js"></script>
  <script src="js/components/profile.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/moodboard.js"></script>
  <script src="js/views/script.js"></script>
  <script src="js/views/kanban.js"></script>
  <script src="js/views/styleframes.js"></script>
  <script src="js/views/motionprojects.js"></script>
  <script src="js/views/reviews.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/trash.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Security: Redirect back to landing if no session
    (async () => {
      const { data: { session } } = await window.supabaseClient.auth.getSession();
      if (!session) window.location.href = 'index.html';
    })();
  </script>
</body>
</html>
